services:
  postgres:
    image: postgres:16-alpine
    container_name: trainlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainlink
      POSTGRES_PASSWORD: trainlink_dev_password
      POSTGRES_DB: trainlink
    ports:
      - "5432:5432"
    volumes:
      - trainlink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlink -d trainlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trainlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trainlink_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: trainlink-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: trainlink_minio
      MINIO_ROOT_PASSWORD: trainlink_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - trainlink_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: trainlink-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 trainlink_minio trainlink_minio_secret;
      mc mb --ignore-existing local/trainlink-private;
      mc mb --ignore-existing local/trainlink-public;
      mc anonymous set download local/trainlink-public;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: trainlink-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  trainlink_postgres_data:
  trainlink_redis_data:
  trainlink_minio_data:
